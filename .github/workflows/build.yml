name: Build Samsung A135F Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libncurses5-dev libssl-dev libtinfo5 python3 unzip wget zip cpio dos2unix

      - name: Download Toolchain (Clang r416183b & GCC)
        run: |
          GH="https://github.com"
          mkdir -p toolchains
          git clone --depth=1 "$GH/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r416183b.git" toolchains/clang-r416183b
          git clone --depth=1 "$GH/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git" toolchains/aarch64-android-4.9-llvm
          git clone --depth=1 "$GH/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git" toolchains/arm-android-4.9-llvm

      - name: Setup KernelSU & Enable Kprobes
        run: |
          RAW="https://githubusercontent.com"
          curl -LSs "$RAW/tiann/KernelSU/main/kernel/setup.sh" | bash -
          scripts/config --file arch/arm64/configs/mizkernel-a13xx_defconfig \
            -e KSU \
            -e KPROBES \
            -e HAVE_KPROBES \
            -e KPROBE_EVENTS \
            -e OVERLAY_FS

      - name: Fix Kconfig & Build Kernel
        run: |
          find drivers/gpu/arm -name "Kconfig*" -exec dos2unix {} +
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$PWD/toolchains/clang-r416183b/bin:$PWD/toolchains/aarch64-android-4.9-llvm/bin:$PWD/toolchains/arm-android-4.9-llvm/bin:$PATH"
          make O=out ARCH=arm64 mizkernel-a13xx_defconfig
          make -j$(nproc) O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi-

      - name: Package AnyKernel3 Zip
        run: |
          GH="https://github.com"
          git clone --depth=1 "$GH/osm0sis/AnyKernel3.git" AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
          sed -i 's|BLOCK=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;|BLOCK=/dev/block/by-name/boot;|g' AnyKernel3/anykernel.sh
          sed -i 's|block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;|block=/dev/block/by-name/boot;|g' AnyKernel3/anykernel.sh
          cp out/arch/arm64/boot/Image AnyKernel3/
          cd AnyKernel3
          zip -r9 ../A135F-UptimeSpoof-Kernel.zip * -x .git README.md *placeholder

      - name: Upload Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: A135F-UptimeSpoof-Kernel
          path: A135F-UptimeSpoof-Kernel.zip
